name: Destekleri güncelle ve bildir
on:
  schedule:
    - cron: "0 4 * * 1"   # her pazartesi 07:00 (Türkiye saati)
  workflow_dispatch:       # elle çalıştırma düğmesi
permissions:
  contents: write
jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - name: Destekler Platformu için tarayıcı ve PDF aracı
        run: |
          sudo apt-get install -y poppler-utils >/dev/null
          python -m playwright install --with-deps chromium >/dev/null
      - name: Destekler Platformu'nu tara (yatirimadestek.gov.tr)
        run: python scraper/yatirimadestek.py
        continue-on-error: true
      - name: Kaynakları tara
        run: python scraper/scrape.py
      - name: Uygun kullanıcılara bildirim gönder
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SITE_URL: ${{ secrets.SITE_URL }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: python scraper/notify.py
      - name: Değişiklik varsa kaydet
        run: |
          git config user.name "destek-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json forms scraper/new_ids.json scraper/platform.json scraper/platform_kapali.json
          git diff --cached --quiet || git commit -m "Destekler güncellendi $(date +%F)"
          git pull --rebase -X theirs origin main || true
          git push
