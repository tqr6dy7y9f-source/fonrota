name: Kesif - Destekler Platformu
on:
  push:
    branches: [kesif-yatirimadestek]
permissions:
  contents: write
jobs:
  kesif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Form belgelerini indir ve cevir
        run: |
          pip install -q requests
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq libreoffice-writer-nogui >/dev/null
          python tara/form_indir.py
      - name: Kaydet
        run: |
          git config user.name "destek-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A formlar && git commit -m "form belgeleri" && git push
