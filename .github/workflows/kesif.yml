name: Kesif - Destekler Platformu
on:
  push:
    branches: [kesif-yatirimadestek]
permissions:
  contents: write
jobs:
  kesif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ozet bilgi formlarini indir
        run: |
          sudo apt-get install -y poppler-utils >/dev/null 2>&1
          mkdir -p kesif4
          B=https://www.yatirimadestek.gov.tr/pdf/assets/upload/dosyalar
          for f in ozet-1711_yapay_zeka_ekosistem_cagrisi_2025_1.pdf ozet-era_net_cofund_araci_destekleme_programi1.pdf ozet-1501_sanayi_ar-ge_projeleri_destekleme_programi_2025_2.pdf ozet_yesil_sanayi_destek_programi.pdf; do
            curl -sSL -m 60 -A "Mozilla/5.0 (compatible; DestekBulucu/1.0)" "$B/$f" -o "kesif4/$f" && pdftotext -layout "kesif4/$f" "kesif4/$f.txt"; sleep 2
          done
          rm -f kesif4/*.pdf; ls -la kesif4
      - name: Kaydet
        run: |
          git config user.name "destek-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A kesif4 && git commit -m "kesif 4" && git push
