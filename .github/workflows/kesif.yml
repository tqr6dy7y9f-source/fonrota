name: Kesif - Destekler Platformu
on:
  push:
    branches: [kesif-yatirimadestek]
permissions:
  contents: write
jobs:
  kesif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Program sayfalarini tarayicida ac
        run: |
          npm i --no-save playwright@1.47.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          mkdir -p kesif3
          cat > r.js <<'JS'
          const { chromium } = require('playwright');
          const ids = ['02c405c5-a85d-4d95-9054-7746681c519a','03b816d6-0474-40b8-9582-4571a16725da'];
          (async () => {
            const b = await chromium.launch(); const p = await b.newPage({ userAgent: 'Mozilla/5.0 (compatible; DestekBulucu/1.0)' });
            for (const id of ids) for (const suf of ['', '/ozet']) {
              await p.goto('https://yatirimadestek.gov.tr/program/' + id + suf, { waitUntil: 'networkidle', timeout: 60000 }).catch(e => console.log(e.message));
              await p.waitForTimeout(3000);
              const n = id.slice(0, 8) + (suf ? '-ozet' : '');
              require('fs').writeFileSync('kesif3/' + n + '.txt', await p.evaluate(() => document.body.innerText));
              require('fs').writeFileSync('kesif3/' + n + '.html', await p.content());
              const links = await p.evaluate(() => [...document.querySelectorAll('a[href]')].map(a => a.innerText.trim().slice(0, 60) + ' -> ' + a.href).filter(s => /pdf|doc|form|başvuru|basvuru|http/i.test(s)));
              require('fs').writeFileSync('kesif3/' + n + '-links.txt', links.join('\n'));
              await p.waitForTimeout(2000);
            }
            await b.close();
          })();
          JS
          node r.js; ls -la kesif3
      - name: Kaydet
        run: |
          git config user.name "destek-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A kesif3 && git commit -m "kesif 3" && git push
